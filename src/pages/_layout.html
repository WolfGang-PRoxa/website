<!doctype html>
<!--
  Mise en page commune. Ne pas ouvrir tel quel : le plugin Vite (scripts/pages.ts) y insère
  la page (src/pages/<page>.html) et les morceaux de src/partials/, remplace chaque {{ clé }}
  par le texte de src/i18n/<langue>.json et génère /fr/, /en/, /fr/legal/, /en/legal/ et /404.html.
-->
<html lang="{{ lang }}" data-theme="dark" class="no-js">
<head>
{{> head }}
{{> seo }}
</head>
<body id="top" data-page="{{ page }}">
{{> nav }}

{{> content }}
{{> footer }}
</body>
</html>
