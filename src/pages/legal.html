<main id="main" tabindex="-1">
  <article class="legal container">
    <header class="legal__head reveal">
      <p class="section__kicker" data-i18n="legal.kicker">{{ legal.kicker }}</p>
      <h1 data-i18n="legal.title">{{ legal.title }}</h1>
      <p class="section__sub" data-i18n="legal.updated">{{ legal.updated }}</p>
    </header>
    <div class="legal__body reveal" data-i18n="legal.body">{{ legal.body }}</div>
  </article>
</main>
